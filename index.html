<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruthless Roleplay</title>
    <!-- Import Barlow Condensed font -->
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            color: #fff;
            background-color: #0b0b0b;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            background-color: rgba(0,0,0,0.8);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        header .logo-container {
            display: flex;
            align-items: center;
        }

        header .logo {
            width: 120px;
            transition: transform 0.3s ease;
        }

        header .logo:hover {
            transform: scale(1.1);
        }

        header nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        header nav ul li a {
            text-decoration: none;
            color: #fff;
            font-weight: bold;
            transition: 0.3s;
        }

        header nav ul li a:hover {
            color: #ff4c4c;
        }

        /* Main content placeholder */
        main {
            padding-top: 100px; /* space for fixed header */
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 20px; /* added small gap between sections */
        }

        main h1 {
            font-family: 'Barlow Condensed', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 8px; /* slightly wider space */
            font-size: 64px;
            margin-bottom: 40px;
            color: #ffffff;
            text-shadow: 2px 2px 10px #000;
        }

        /* Players Online Box */
        #players-box {
            width: 250px;
            height: 80px;
            background-color: rgba(255,255,255,0.05);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 20px rgba(255,76,76,0.5);
            transition: 0.3s;
        }

        #players-box:hover {
            box-shadow: 0 0 30px rgba(255,76,76,0.8);
        }

        /* Updates Section */
        #updates {
            width: 250px;
            padding: 15px;
            background-color: rgba(255,255,255,0.05);
            border-radius: 5px;
            font-size: 14px;
            box-shadow: 0 0 20px rgba(255,76,76,0.5);
            color: #ffffff;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 0;
            background-color: rgba(0,0,0,0.8);
            margin-top: 50px;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo-container">
            <img src="https://github.com/kuyajepgaming/ruthlessroleplay/raw/e53ebb83a3aa1623bf38bd215629ac792358384f/Ruthless%20Logo%202.png" alt="Ruthless RP Logo" class="logo">
        </div>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#rules">Rules</a></li>
                <li><a href="#applications">Applications</a></li>
                <li><a href="#streamers">Streamers</a></li>
                <li><a href="#updates">Updates</a></li> <!-- Added Updates menu -->
            </ul>
        </nav>
    </header>

    <!-- Main content placeholder -->
    <main>
        <h1>WELCOME TO RUTHLESS ROLEPLAY</h1>
        <div id="players-box">
            Players Online: <span id="players-count">0</span>
        </div>
        <div id="updates">
            Server and Site Currently Under Reconstruction
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 Ruthless Roleplay. All rights reserved.</p>
    </footer>

    <script>
        const playersCount = document.getElementById('players-count');

        async function updatePlayers() {
            try {
                const response = await fetch('https://YOUR-FIVEM-SERVER-IP:30120/players.json'); // Replace with your server IP
                const data = await response.json();
                playersCount.textContent = data.length;
            } catch (err) {
                console.error('Could not fetch player count', err);
                playersCount.textContent = 'N/A';
            }
        }

        // Update every 5 seconds
        setInterval(updatePlayers, 5000);
        updatePlayers(); // initial load
    </script>
</body>
</html>
